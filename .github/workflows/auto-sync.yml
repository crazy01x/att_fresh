name: Auto Sync Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync manifests
        env:
          SOURCES_JSON: ${{ secrets.FRESH_UPDATE_SOURCES_JSON }}
        run: |
          if [ -z "$SOURCES_JSON" ]; then
            echo "Missing FRESH_UPDATE_SOURCES_JSON secret"
            exit 1
          fi
          printf '%s' "$SOURCES_JSON" > config/sources.json
          python scripts/sync_updates.py --sources config/sources.json

      - name: Validate manifests
        run: python scripts/validate_manifests.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync fresh update manifests"
          branch: chore/auto-sync-manifests
          delete-branch: true
          title: "chore: sync fresh update manifests"
          body: |
            Automated update sync for app and language manifests.
